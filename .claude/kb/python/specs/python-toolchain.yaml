schema_version: "1.0"
domain: python
file_type: pyproject.toml
last_validated: "2026-10-09"
source: "packaging.python.org (pyproject spec, PEP 735), docs.astral.sh/uv, docs.astral.sh/ruff, mypy docs, docs.pytest.org"

# Note: this domain's spec describes TOML tables, not fixed-width records, so
# the template's `position`/`length` keys are not applicable and are omitted.
records:
  project:
    description: "[project] table -- PEP 621 core metadata"
    fields:
      name:
        type: string
        required: true
        default: ""
        validation:
          - "matches ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$"
          - "kebab-case recommended (e.g. projeto-data-warehouse)"
        notes: "Import package name may differ (underscores)"
      version:
        type: string
        required: true
        default: "0.1.0"
        validation:
          - "PEP 440 version string"
        notes: "Or declare `dynamic = [\"version\"]`"
      requires-python:
        type: string
        required: true
        default: ">=3.12"
        validation:
          - "lower bound must be >= 3.12 for this KB (PEP 695, itertools.batched)"
        notes: "uv uses it to constrain resolution and pick the interpreter"
      dependencies:
        type: string  # list of PEP 508 requirement strings
        required: false
        default: "[]"
        validation:
          - "each entry is a PEP 508 requirement"
          - "runtime deps only; test/lint tools go to [dependency-groups]"
        notes: "Managed via `uv add` / `uv remove`"

  dependency-groups:
    description: "[dependency-groups] table -- PEP 735 local-only groups"
    fields:
      dev:
        type: string  # list of PEP 508 requirement strings
        required: true
        default: "[]"
        validation:
          - "contains pytest, ruff, mypy"
        notes: "Synced by default by `uv sync`; excluded with `--no-dev`"

  tool.ruff:
    description: "[tool.ruff] and [tool.ruff.lint] -- linter/formatter config"
    fields:
      target-version:
        type: string
        required: false
        default: "inferred from requires-python"
        validation:
          - "one of py312, py313, py314"
        notes: "Controls which syntax upgrades (UP rules) are suggested"
      line-length:
        type: integer
        required: false
        default: "88"
        validation:
          - "between 79 and 120"
        notes: "Shared by `ruff check` (E501) and `ruff format`"
      lint.select:
        type: string  # list of rule codes
        required: true
        default: "[\"E4\", \"E7\", \"E9\", \"F\"]"
        validation:
          - "includes at least E, F, I, B, UP"
        notes: "See patterns/project-setup-uv.md for the recommended set"

  tool.mypy:
    description: "[tool.mypy] -- static type checker config"
    fields:
      strict:
        type: boolean
        required: true
        default: "false"
        validation:
          - "must be true for src/"
        notes: "Use [[tool.mypy.overrides]] with ignore_missing_imports for untyped libs"
      python_version:
        type: string
        required: false
        default: "running interpreter"
        validation:
          - "matches requires-python lower bound"
        notes: ""

  tool.pytest.ini_options:
    description: "[tool.pytest.ini_options] -- test runner config"
    fields:
      testpaths:
        type: string  # list of directories
        required: true
        default: "[\"tests\"]"
        validation:
          - "every path exists"
        notes: ""
      addopts:
        type: string  # list of CLI flags
        required: false
        default: "[]"
        validation:
          - "includes --strict-markers"
          - "includes --import-mode=importlib for new projects"
        notes: ""

  uv.lock:
    description: "Lockfile generated by uv (not a pyproject table)"
    fields:
      committed:
        type: boolean
        required: true
        default: "true"
        validation:
          - "tracked in git"
          - "CI runs `uv sync --locked`"
        notes: "Never edit by hand"
