[project]
name = "projeto-data-warehouse"
version = "0.1.0"
description = "Data Warehouse com Python + Postgres + dbt + Airflow + Metabase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "sqlfluff>=3.2",
]
dbt = [
    "dbt-core~=1.11.0",
    "dbt-postgres~=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "dbt/target", "dbt/dbt_packages", "airflow/logs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit (segurança)
    "SIM", # simplificações
    "N",   # nomes PEP 8
]

[tool.ruff.lint.per-file-ignores]
# Em testes: assert (S101) e senhas fictícias (S105/S106) são permitidos.
"tests/**" = ["S101", "S105", "S106"]
"airflow/tests/**" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["src/ingestion"]
