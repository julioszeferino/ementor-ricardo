name: dw

# Configuração compartilhada pelos serviços do Airflow 3 (LocalExecutor, sem Celery/Redis).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: dw-airflow:3.3.2
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${APP_DB_USER}:${APP_DB_PASSWORD}@app-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?defina AIRFLOW_JWT_SECRET no .env}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Variáveis lidas pela ingestão (src/ingestion/config.py) e pelo dbt (dbt/profiles.yml)
    DW_HOST: postgres
    DW_PORT: "5432"
    DATA_DIR: /opt/project/data
    PYTHONPATH: /opt/project/src
    DBT_PROFILES_DIR: /opt/project/dbt
    DBT_PROJECT_DIR: /opt/project/dbt
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/tests:/opt/airflow/tests:ro
    - ./src:/opt/project/src:ro
    - ./data:/opt/project/data:ro
    - ./dbt:/opt/project/dbt
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    app-db:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # ------------------------------------------------------------------ Data Warehouse
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DW_USER}
      POSTGRES_PASSWORD: ${DW_PASSWORD:?defina DW_PASSWORD no .env}
      POSTGRES_DB: ${DW_DATABASE}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dw-data:/var/lib/postgresql          # Postgres >= 18 usa este caminho
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Banco de metadados do Airflow e do Metabase (isolado dos dados do DW).
  app-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}
      POSTGRES_DB: airflow
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./postgres/app-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------------ Ingestão e dbt
  # Job sob demanda: docker compose --profile jobs run --rm ingestion
  ingestion:
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
    image: dw-tools:latest
    profiles: [jobs]
    env_file: .env
    environment:
      DW_HOST: postgres
      DW_PORT: "5432"
      DATA_DIR: /app/data
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    command: ["python", "-m", "ingestion.main"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Container interativo: docker compose exec dbt bash  ->  dbt build
  dbt:
    image: dw-tools:latest
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
    env_file: .env
    environment:
      DW_HOST: postgres
      DW_PORT: "5432"
      DBT_PROFILES_DIR: /app/dbt
    working_dir: /app/dbt
    volumes:
      - ./dbt:/app/dbt
    command: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ Airflow 3
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "0:0"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------------ Visualização
  metabase:
    image: metabase/metabase:v0.63.19.6
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: app-db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${APP_DB_USER}
      MB_DB_PASS: ${APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      app-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dw-data: {}
  app-db-data: {}
