# Sem segredos aqui: tudo vem de variáveis de ambiente (.env / GitHub Secrets).
data_warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DW_HOST', 'localhost') }}"
      port: "{{ env_var('DW_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('DW_DATABASE', 'warehouse') }}"
      user: "{{ env_var('DW_USER', 'postgres') }}"
      password: "{{ env_var('DW_PASSWORD') }}"
      schema: public
      threads: 4
